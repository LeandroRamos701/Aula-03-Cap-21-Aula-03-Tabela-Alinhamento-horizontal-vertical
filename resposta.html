<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            
            width: 200px;       
            height: 400px;
            border-collapse: collapse;
        }
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
        }
        .esquerda{
            text-align: left;
        }
        .direita{
            text-align: right;
        }
        .topo{
            vertical-align: top;
        }
        .baixo{
            vertical-align: bottom;
        }
        .numero{
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Gabarito - Trabalhando com alinhamento</h1>
    <table>
        <tr>
            <td class="left">
                A1<br>
                (esquerda)
            </td>
            <td class="middle">
                B1
                (padrão centro)
            </td>
            <td class="right">
                C1<br>
                (direita)
            </td>
            
        </tr>
        <tr>
            <td class="top">
            A2<br>
            (topo)
            </td>
            <td>
                B2<br>
                (padrão)
            </td>
            <td class="bottom">
            C2<br>
            (baixo)
            </td>
        </tr>
        <tr>
            <td class="top">
            A3<br>
            (topo)
            </td>
            <td class="bottom">

            </td>
        </tr>
    </table>
</body>
</html>
